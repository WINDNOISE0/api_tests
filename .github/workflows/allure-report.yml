name: Allure Report on PR

on:
  pull_request:
    branches:
      - main

jobs:
  test-and-publish:
    runs-on: ubuntu-latest

    services:  # если ты используешь docker-compose – отключи этот блок
      auth:
        image: your-auth-service-image  # ЗАМЕНИ на свой образ
        ports:
          - 8000:8000
        options: >-
          --health-cmd="curl -f http://localhost:8000/docs || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install allure-pytest

      - name: Install Allure CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y default-jre unzip curl
          curl -L -o allure.zip https://github.com/allure-framework/allure2/releases/download/2.27.0/allure-2.27.0.zip
          unzip allure.zip -d /opt/
          sudo ln -s /opt/allure-2.27.0/bin/allure /usr/bin/allure

      - name: Wait for auth service
        run: |
          for i in {1..30}; do
            curl -sSf http://localhost:8000/docs && break
            echo "Waiting for AuthService..."
            sleep 5
          done

      - name: Run tests
        run: |
          pytest --alluredir=allure-results || echo "Some tests failed"

      - name: Generate Allure report
        run: |
          allure generate allure-results -o allure-report --clean

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report