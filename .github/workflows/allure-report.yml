name: Allure Report via Docker Compose

on:
  pull_request:
    branches:
      - main

jobs:
  test-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Compose
        run: docker compose version

      - name: Build and run tests
        run: |
          docker compose down || true
          docker compose up --build --abort-on-container-exit || true

      - name: Copy Allure report from container
        run: |
          mkdir -p allure-report
          docker cp test-framework:/tests/allure-report ./allure-report || echo "No report found"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
